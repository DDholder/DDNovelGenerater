[project]
name = "ddnovel"
version = "0.1.0"
description = "DDNovelGenerater: 与书库解耦、一引擎驱动多本书的长篇小说创作工程底座 (CLI + MCP + Skills)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "DDNovelGenerater Contributors" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
]
dependencies = [
    "pydantic>=2.9",
    "pyyaml>=6.0.2",
    "typer>=0.12",
    "rich>=13.7",
    "jieba>=0.42.1",
    "fastmcp>=2.3",
]

[project.optional-dependencies]
# 可选插拔向量检索插件 (T07)，默认关闭，零外部调用
vector = [
    "sqlite-vec>=0.1.6",
    "numpy>=1.26",
]

[project.scripts]
ddnovel = "ddnovel.cli:main"
ddnovel-mcp = "ddnovel.mcp_server:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ddnovel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 110
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
