cultivation_rpg:
  premise: "以境界秩序、宗门博弈与因果宿怨为核心，写实刻画主角于灵气潮汐与人心险恶中步步破境求存。"
  settings:
    - path: "01_settings/world/world_overview.md"
      id: "world_overview"
      name: "苍冥修真界"
      aliases:
        - "苍冥界"
      category: "world"
      status: "active"
      tags:
        - "修真"
        - "世界观"
      core_text: "灵脉分布极不均衡的修真天地，宗门与世家垄断上品灵矿与高阶功法，散修与外门弟子须凭战功或机缘换取破境资粮。"
      topic_name: "境界与灵脉法则"
      topic_text: "炼气、筑基、金丹、元婴四境森严，灵气稀薄之地强行冲击大境极易导致气海反噬。"
      secret_text: "每隔三百年的天象异动实为上古大阵吸纳天地灵机的余波，而非单纯天灾。"
    - path: "01_settings/geography/loc_starter_stage.md"
      id: "loc_starter_stage"
      name: "青岚山外门药庐"
      aliases:
        - "外门药庐"
      category: "geography"
      status: "active"
      tags:
        - "宗门地标"
      core_text: "坐落于青岚宗东麓寒溪旁的石砌药庐，灵气虽属下品，胜在清静偏僻，四周种满耐寒的青霜草。"
      topic_name: "后山古阵残迹"
      topic_text: "药庐后崖半里处有一座早已被宗门废弃的残破聚灵阵台，月晦之夜偶有微弱灵纹闪动。"
      secret_text: "残破阵台之下镇压着一枚与上古剑修传承相关的无主阵眼。"
    - path: "01_settings/factions/fac_main_org.md"
      id: "fac_main_org"
      name: "青岚宗"
      aliases:
        - "青岚门"
      category: "faction"
      status: "active"
      tags:
        - "宗门"
      core_text: "东域二流修真大宗，以剑丹双修立宗，内部分为执事、传功、丹器三脉，宗规森严却也暗藏派系倾轧。"
      topic_name: "外门大比制度"
      topic_text: "每三年举行一次外门小比，前十名可入内门秘阁择取一道中品筑基辅助功法。"
      secret_text: "掌门一脉与执法堂长老之间因百年前秘境旧案早已面和心不合。"
    - path: "01_settings/characters/char_protagonist.md"
      id: "char_protagonist"
      name: "顾青"
      aliases:
        - "顾师弟"
      category: "character"
      status: "active"
      tags:
        - "主角"
        - "剑修"
      core_text: "十七岁入青岚宗的外门杂役弟子，性情内敛坚韧，擅长看火候与辨识灵草药性，暗中勤修基础吐纳与拔剑式。"
      topic_name: "战斗与藏拙习惯"
      topic_text: "与人交手前习惯先留三分真气护住心脉，不到生死关头绝不显露压箱底身法。"
      secret_text: "顾青幼年随身携带的残缺木牌实为上古剑宗接引信物，能够隐约共鸣纯正剑意。"
    - path: "01_settings/items/item_key_token.md"
      id: "item_key_token"
      name: "裂纹玄铁令牌"
      aliases:
        - "玄铁令牌"
      category: "item"
      status: "active"
      tags:
        - "法宝"
        - "信物"
      core_text: "巴掌大小、边缘缺了一角的暗沉玄铁牌，入手微凉，表面蚀刻着难以辨认的古篆云纹。"
      topic_name: "灵气共鸣特性"
      topic_text: "遇高纯度剑气或寒属性灵材时会泛起一丝微不可察的青光，平日与凡铁无异。"
      secret_text: "令牌缺口对应着青岚宗祖师密室残图的三分之一拼合印记。"
  volume:
    id: "vol_01"
    title: "微末起青萍"
    chapter_range: [1, 30]
    core_conflict: "主角须在宗门倾轧与资源匮乏下稳步筑基，解开残缺玄铁令牌牵引出的第一重传承秘密。"
    body: |
