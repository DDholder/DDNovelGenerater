mystery_intrigue:
  premise: "围绕多层伪装、情报甄别与时间线推理，在暗流涌动的迷局中层层剥茧。"
  settings:
    - path: "01_settings/world/world_overview.md"
      id: "world_overview"
      name: "民国雾城情报暗战网"
      aliases:
        - "雾城暗局"
      category: "world"
      status: "active"
      tags:
        - "悬疑"
        - "谍战"
      core_text: "多方势力盘踞的滨江商埠雾城，表面租界林立、报馆茶楼熙攘，实则密码电台、特派密探与黑市中间人交错纵横。"
      topic_name: "单线联络铁律"
