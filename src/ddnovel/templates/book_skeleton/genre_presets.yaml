      - "严禁使用悬浮爽文式巧合直接化解初始危机"
    beats:
      - index: 1
        title: "雨夜加班"
        content: "陆沉在滨海高新区创研园的办公室复核最后一组数据，窗外暴雨敲打玻璃，手机突然亮起陌生提示。"
      - index: 2
        title: "异常信号"
        content: "陆工取出加密银色移动盘接入测试终端，却发现启明项目组的旧备份校验记录出现一处多出来的凌晨时间戳。"
      - index: 3
        title: "定锚起航"
        content: "陆沉合上笔记本决定暂不打草惊蛇，次日一早按原计划赴会，为全书主线埋下第一颗钉子。"
    body: |
      ## 本章创作提示
      开篇直入具体情境与人物动作，用克制节奏建立悬念感与现场代入感。
