general:
  premise: "立足当代现实与职场博弈，围绕理想坚守、利益冲突与人性抉择展开长线叙事。"
  settings:
    - path: "01_settings/world/world_overview.md"
      id: "world_overview"
      name: "现代都市行业生态"
      aliases:
        - "当代背景"
      category: "world"
      status: "active"
      tags:
        - "世界观"
        - "都市"
      core_text: "故事发生于二十一世纪二十年代的沿海中心城市，产业升级与资本周期交织，专业规则与人情博弈并存。"
      topic_name: "行业潜规则"
      topic_text: "招投标与项目评审讲究合规留痕与可验证交付，越是关键节点越需防范口头承诺。"
      secret_text: "表面看似平稳的行业秩序下，旧派巨头与新锐力量已围绕核心标准争夺暗流涌动。"
    - path: "01_settings/geography/loc_starter_stage.md"
      id: "loc_starter_stage"
      name: "滨海高新区创研园"
      aliases:
        - "创研园"
      category: "geography"
      status: "active"
      tags:
        - "核心舞台"
      core_text: "位于滨海市南岸的科技孵化园区，写字楼通宵灯火不息，楼下便利店与咖啡亭见证了无数团队的起落。"
      topic_name: "园区夜间动线"
      topic_text: "晚十点后只保留东门刷卡通道，地下一层档案室与机房共用备用供电回路。"
      secret_text: "创研园三期老厂房地下仍保留着十年前某研究所撤离时封存的旧测试管廊。"
    - path: "01_settings/factions/fac_main_org.md"
      id: "fac_main_org"
      name: "启明项目组"
      aliases:
        - "启明团队"
      category: "faction"
      status: "active"
      tags:
        - "主角阵营"
      core_text: "由主角发起的精干技术攻关小组，成员不足十人，正背水一战冲刺年度标杆项目交付。"
      topic_name: "内部协作机制"
      topic_text: "每周五晚进行全量进度复盘，关键数据与合同底稿实行双人交叉复核。"
      secret_text: "项目组早年签署过一份附带隐性回购条款的种子轮补充协议，目前仅少数核心知情。"
    - path: "01_settings/characters/char_protagonist.md"
      id: "char_protagonist"
      name: "陆沉"
      aliases:
        - "陆工"
      category: "character"
      status: "active"
      tags:
        - "主角"
      core_text: "三十岁上下，沉稳克制、习惯在压力下保持冷静推演的骨干负责人。常穿深色防风外套，随身携带一本翻旧的黑色笔记本。"
      topic_name: "决断习惯"
      topic_text: "面对突发危机时，陆沉会先核对时间线与可验证事实，再在纸面列出三条备选退路。"
      secret_text: "陆沉三年前主动离开原大厂，实为调查导师当年离奇撤项的真正内幕。"
    - path: "01_settings/items/item_key_token.md"
      id: "item_key_token"
      name: "加密银色移动盘"
      aliases:
        - "银色移动盘"
      category: "item"
      status: "active"
      tags:
        - "关键物品"
      core_text: "外壳刻有编号的军工级抗震加密移动硬盘，内含核心工程基线与历史审计日志。"
      topic_name: "口令校验规则"
      topic_text: "连续三次输入错误校验码会触发硬件只读锁定，必须由主密钥签发方重置。"
      secret_text: "盘内隐藏分区中还保存着一份未公开的旧项目原始签字扫描件。"
  volume:
    id: "vol_01"
    title: "破局立锚"
    chapter_range: [1, 30]
    core_conflict: "主角团队必须在资金与时间双重倒计时内完成关键交付，同时揭开外部施压背后的真正推手。"
    body: |
      ## 卷级起承转合
      - **第 1～10 章**：风波初起，团队接手硬骨头任务并发现异常线索。
      - **第 11～20 章**：多方角力升级，内部短板暴露与外部围堵接踵而至。
      - **第 21～30 章**：正面破局拿下首战胜利，顺势撬开下一阶段更大棋局。
  arc:
